<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ryderwear Gyms — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#0f0f1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:380px;background:#fff;border:1px solid #ececef;border-radius:14px;padding:32px;box-shadow:0 4px 24px #00000010}
.brand{display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.brand img{height:48px;width:auto;filter:brightness(0)}
h1{font-size:22px;font-weight:600;color:#1a1a26;letter-spacing:-.01em;text-align:center;margin-bottom:6px}
.sub{font-size:15px;color:#777;font-weight:500;text-align:center;margin-bottom:24px}
label{display:block;font-size:14px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
input[type=password]{width:100%;background:#fff;color:#1a1a26;border:1px solid #d4d4d8;border-radius:8px;padding:12px 14px;font-size:17px;font-family:inherit;outline:none;transition:border-color .15s}
input[type=password]:focus{border-color:#6366f1}
button{width:100%;background:#1a1a26;color:#fff;border:1px solid #1a1a26;border-radius:8px;padding:12px 14px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:16px;transition:background .15s}
button:hover:not(:disabled){background:#0f0f1a}
button:disabled{opacity:.6;cursor:not-allowed}
.err{color:#c8302d;font-size:14px;margin-top:12px;text-align:center;min-height:18px}
</style>
</head>
<body>
<form class="card" id="form" autocomplete="off">
  <div class="brand">
    <img src="/logo.png" alt="Ryderwear" onerror="this.style.display='none'">
  </div>
  <h1>Sign in</h1>
  <div class="sub">Enter the dashboard password</div>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
  <button type="submit" id="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
const form = document.getElementById('form');
const pwd = document.getElementById('password');
const btn = document.getElementById('submit');
const err = document.getElementById('err');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: pwd.value }),
    });
    if (r.ok) {
      window.location.href = '/';
      return;
    }
    if (r.status === 401) err.textContent = 'Incorrect password';
    else if (r.status === 500) err.textContent = 'Auth not configured on server';
    else err.textContent = 'Sign in failed';
  } catch {
    err.textContent = 'Network error';
  }
  btn.disabled = false;
  btn.textContent = 'Sign in';
  pwd.select();
});
</script>
</body>
</html>
