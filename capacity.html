<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ryderwear Gyms — Target Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#0f0f1a;padding:24px;min-height:100vh;-webkit-font-smoothing:antialiased}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid #00000010;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand-logo{height:56px;width:auto;display:block;filter:brightness(0)}
.brand-divider{width:1px;height:36px;background:#00000018;margin:0 4px}
.brand-title{display:flex;flex-direction:column;gap:2px}
h1{font-size:27px;font-weight:600;color:#1a1a26;letter-spacing:-.01em}
.sub{font-size:18px;color:#777;font-weight:500}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.user-chip{font-size:15px;color:#555;background:#f4f4f6;border:1px solid #ececef;border-radius:20px;padding:6px 14px;font-weight:600}
.user-chip b{color:#1a1a26}
a.navlink,button.navlink{background:#fff;color:#1a1a26;border:1px solid #d4d4d8;border-radius:8px;padding:8px 14px;font-size:16px;font-family:inherit;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;transition:background .15s}
a.navlink:hover,button.navlink:hover{background:#f4f4f6}

.meta-row{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;color:#888;margin-bottom:22px;letter-spacing:.02em}
.meta-row b{color:#555;font-weight:600}

.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:12px}
.hero-card{background:#fff;border:1px solid #ececef;border-radius:16px;padding:24px;box-shadow:0 1px 2px #0000000a}
.hero-label{font-size:15px;color:#777;text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-bottom:4px}
.hero-span{font-size:14px;color:#a0a0a8;font-weight:500;margin-bottom:14px}
.hero-value{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline;gap:10px}
.hero-value small{font-size:22px;font-weight:600;color:#a0a0a8}
.hero-meter{margin-top:18px}
.hero-meter .meter-track{height:12px}
.hero-meter .meter-fill{height:12px}
.hero-meter-note{font-size:14px;color:#888;margin-top:8px;letter-spacing:.02em}
.hero-meter-note b{color:#555;font-weight:700}
.hero-foot{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:15px;color:#777}
.hero-foot b{font-weight:700}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:32px 0 14px;flex-wrap:wrap}
.section-title{font-size:21px;font-weight:600;color:#1a1a26}
select{background:#fff;color:#1a1a26;border:1px solid #d4d4d8;border-radius:8px;padding:8px 12px;font-size:16px;font-family:inherit;cursor:pointer}
select:hover{border-color:#a0a0a8}

.gym-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.gym-card{background:#fff;border:1px solid #ececef;border-radius:16px;padding:22px;box-shadow:0 1px 2px #0000000a;transition:border-color .2s,box-shadow .2s}
.gym-card:hover{border-color:#d4d4d8;box-shadow:0 8px 24px #00000012}
.gym-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.gym-name{font-size:19px;font-weight:700;color:#0f0f1a;letter-spacing:-.01em}
.chip{font-size:14px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap;letter-spacing:.02em}
.chip.good{background:#10b9811f;color:#0c8f63}
.chip.warn{background:#f59e0b24;color:#a16207}
.chip.bad{background:#ef44441f;color:#c8302d}
.chip.none{background:#f4f4f6;color:#888}

.meter-row{display:grid;grid-template-columns:62px 1fr 64px;align-items:center;gap:12px;margin-bottom:12px}
.meter-key{font-size:14px;color:#888;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.meter-track{position:relative;height:10px;background:#f0f0f3;border-radius:6px;overflow:visible}
.meter-fill{position:absolute;left:0;top:0;height:10px;border-radius:6px;transition:width .4s ease}
.meter-fill.good{background:#10b981}
.meter-fill.warn{background:#f59e0b}
.meter-fill.bad{background:#ef4444}
.meter-fill.none{background:#d4d4d8}
.meter-over{position:absolute;right:-2px;top:-3px;width:4px;height:16px;border-radius:2px;background:#0c8f63}
.meter-mark{position:absolute;top:-4px;width:2px;height:18px;background:#1a1a2655;border-radius:1px}
.meter-pct{font-size:17px;font-weight:700;text-align:right;color:#1a1a26}
.meter-pct.muted{color:#c0c0c8;font-weight:600}

.detail{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid #f0f0f3}
.detail-col-title{font-size:13px;color:#888;text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-bottom:8px}
.detail-line{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:#777;margin-bottom:5px}
.detail-line b{color:#1a1a26;font-weight:600;white-space:nowrap}
.detail-line b.good{color:#0c8f63}
.detail-line b.bad{color:#c8302d}
.detail-line b.warn{color:#a16207}

.spark{margin-top:16px;padding-top:14px;border-top:1px solid #f0f0f3}
.spark-head{display:flex;justify-content:space-between;font-size:13px;color:#888;margin-bottom:7px;letter-spacing:.03em}
.spark svg{display:block;width:100%;height:38px}

.notice{background:#f4f4ff;border:1px solid #6366f140;border-radius:10px;padding:14px 18px;margin-bottom:18px;font-size:16px;color:#4a4a8a;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice a{color:#4f46e5;font-weight:600}
.empty{color:#999;font-size:15px;padding:14px 0;text-align:center}

.spinner{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;gap:14px}
.spin{width:40px;height:40px;border:3px solid #ececef;border-top:3px solid #6366f1;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#fff;border:1px solid #ef4444;border-radius:12px;padding:32px;max-width:520px;margin:80px auto;text-align:center;box-shadow:0 4px 16px #00000010}
#app{display:none}

@media(max-width:900px){.hero{grid-template-columns:1fr}.gym-grid{grid-template-columns:1fr}}
@media(max-width:480px){body{padding:16px}.detail{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loading" class="spinner">
  <div class="spin"></div>
  <div style="color:#1a1a26;font-size:20px">Loading target tracking…</div>
</div>

<div id="errorBox" class="error-box" style="display:none">
  <div style="font-size:44px;margin-bottom:12px">⚠️</div>
  <div style="color:#ef4444;font-weight:700;margin-bottom:8px;font-size:22px">Couldn't load</div>
  <div id="errMsg" style="color:#555;font-size:18px;margin-bottom:20px"></div>
  <button class="navlink" onclick="load()">↻ Retry</button>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <img src="/logo.png" alt="Ryderwear Gym" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-divider"></div>
      <div class="brand-title">
        <h1>Target Tracking</h1>
        <div class="sub" id="subline">% of target by gym</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="user-chip" id="userChip"></span>
      <a class="navlink" id="navSales" href="/" style="display:none">Sales analytics</a>
      <a class="navlink" id="navAdmin" href="/admin.html" style="display:none">Targets &amp; logins</a>
      <button class="navlink" onclick="load()">↻ Refresh</button>
      <button class="navlink" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="meta-row" id="metaRow"></div>
  <div id="notices"></div>

  <div class="hero" id="hero"></div>

  <div id="gymSection">
    <div class="section-head">
      <div class="section-title" id="gymSectionTitle">By gym</div>
      <select id="sortSel" onchange="render()">
        <option value="week">Sort: week % of target</option>
        <option value="month">Sort: month % of target</option>
        <option value="today">Sort: today % of target</option>
        <option value="name">Sort: gym name</option>
      </select>
    </div>
    <div class="gym-grid" id="gymGrid"></div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const AUTO_REFRESH_MS = 5 * 60 * 1000;
const SPARK_MAX_PCT = 150;   // a 150%-of-target day fills the sparkline bar

// ── State ─────────────────────────────────────────────────────────────────
let data = null;
let me = null;

// ── Helpers ───────────────────────────────────────────────────────────────
const pctText = v => (v == null ? "—" : Math.round(v) + "%");
// The only dollar figure on the page: what's still needed per trading day.
const moneyText = v => (v == null ? "—" : "$" + Math.round(v).toLocaleString("en-AU"));
const el = id => document.getElementById(id);

// Pace tone: how a gym is travelling versus where it should be by now.
function tone(pacePct){
  if (pacePct == null) return "none";
  if (pacePct >= 98)  return "good";
  if (pacePct >= 90)  return "warn";
  return "bad";
}
// The dollars-needed figure is coloured by how it compares with a normal
// target day: well above one means the gym has to out-trade itself to catch up.
function needTone(block){
  const p = block.requiredPctOfDaily;
  if (p == null) return "";
  if (p > 115) return "bad";
  if (p > 100) return "warn";
  return "good";
}

function toneLabel(pacePct){
  if (pacePct == null) return "No target";
  if (pacePct >= 102) return "Ahead";
  if (pacePct >= 98)  return "On pace";
  if (pacePct >= 90)  return "Slightly behind";
  return "Behind";
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  ));
}

function timeAgo(ts){
  if (!ts) return "never";
  const mins = Math.round((Date.now() - ts) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  return Math.round(hrs / 24) + "d ago";
}

function dayLabel(iso){
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-AU", {
    weekday: "short", timeZone: "UTC"
  });
}

// ── Components ────────────────────────────────────────────────────────────
// A bar showing % of target, with a tick marking where the gym should be by
// now if it had traded evenly across the period.
function meter(key, achievedPct, expectedPct, targetSet){
  const t = targetSet ? tone(expectedPct > 0 ? (achievedPct / expectedPct) * 100 : null) : "none";
  const width = Math.min(100, Math.max(0, achievedPct || 0));
  const markAt = Math.min(100, Math.max(0, expectedPct || 0));
  const over = targetSet && achievedPct > 100;
  return `
    <div class="meter-row">
      <div class="meter-key">${key}</div>
      <div class="meter-track">
        <div class="meter-fill ${t}" style="width:${width}%"></div>
        ${over ? '<div class="meter-over"></div>' : ""}
        ${targetSet ? `<div class="meter-mark" style="left:${markAt}%" title="Expected by now"></div>` : ""}
      </div>
      <div class="meter-pct ${targetSet ? "" : "muted"}">${targetSet ? pctText(achievedPct) : "—"}</div>
    </div>`;
}

// 14 days of "% of daily target", one bar per day.
function sparkline(trend){
  const w = 100, h = 38, gap = 1.6;
  const barW = (w - gap * (trend.length - 1)) / trend.length;
  const bars = trend.map((d, i) => {
    const x = i * (barW + gap);
    if (d.pct == null) {
      return `<rect x="${x.toFixed(2)}" y="${h - 2}" width="${barW.toFixed(2)}" height="2" rx="1" fill="#ececef"></rect>`;
    }
    const scaled = Math.min(1, d.pct / SPARK_MAX_PCT);
    const barH = Math.max(2, scaled * h);
    const fill = d.pct >= 100 ? "#10b981" : d.pct >= 90 ? "#f59e0b" : "#ef4444";
    const opacity = d.isToday ? 1 : 0.75;
    return `<rect x="${x.toFixed(2)}" y="${(h - barH).toFixed(2)}" width="${barW.toFixed(2)}" height="${barH.toFixed(2)}" rx="1" fill="${fill}" opacity="${opacity}"><title>${esc(d.date)} — ${pctText(d.pct)} of daily target</title></rect>`;
  }).join("");

  // 100%-of-target reference line
  const refY = h - (100 / SPARK_MAX_PCT) * h;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Last 14 days versus daily target">
    <line x1="0" y1="${refY.toFixed(2)}" x2="${w}" y2="${refY.toFixed(2)}" stroke="#1a1a2622" stroke-width="0.6" stroke-dasharray="2 2"></line>
    ${bars}
  </svg>`;
}

function heroCard(label, span, block, extraFoot){
  const t = block.targetSet ? tone(block.pacePct != null ? block.pacePct
            : (block.expectedPct > 0 ? (block.achievedPct / block.expectedPct) * 100 : null)) : "none";
  const colour = { good:"#0c8f63", warn:"#a16207", bad:"#c8302d", none:"#a0a0a8" }[t];
  return `
    <div class="hero-card">
      <div class="hero-label">${esc(label)}</div>
      <div class="hero-span">${esc(span)}</div>
      <div class="hero-value" style="color:${colour}">
        ${block.targetSet ? pctText(block.achievedPct) : "—"}
        <small>${block.targetSet ? "of target" : "no target set"}</small>
      </div>
      ${block.targetSet ? `
        <div class="hero-meter">
          <div class="meter-track">
            <div class="meter-fill ${t}" style="width:${Math.min(100, Math.max(0, block.achievedPct || 0))}%"></div>
            ${block.achievedPct > 100 ? '<div class="meter-over"></div>' : ""}
            <div class="meter-mark" style="left:${Math.min(100, Math.max(0, block.expectedPct || 0))}%"></div>
          </div>
          <div class="hero-meter-note">
            Expected by now <b>${pctText(block.expectedPct)}</b>
          </div>
        </div>` : ""}
      <div class="hero-foot">${extraFoot}</div>
    </div>`;
}

// ── Render ────────────────────────────────────────────────────────────────
function render(){
  if (!data) return;
  const cal = data.calendar;

  el("userChip").innerHTML = `<b>${esc(data.username)}</b> · ${data.role === "admin" ? "Admin" : "Gym"}`;
  if (me && me.role === "admin"){
    el("navSales").style.display = "inline-block";
    el("navAdmin").style.display = "inline-block";
  }

  const basisLabel = data.basis === "apparel" ? "apparel only (ex gym products)" : "all in-store sales";
  el("metaRow").innerHTML = `
    <span>Today <b>${esc(cal.today)}</b></span>
    <span>Week <b>day ${cal.weekDayIndex} of 7</b></span>
    <span>Month <b>day ${cal.monthDayIndex} of ${cal.daysInMonth}</b></span>
    <span>Measured on <b>${esc(basisLabel)}</b></span>
    <span>Sales data <b>${esc(timeAgo(data.dataUpdatedAt))}</b></span>
    <span>Targets set <b>${esc(timeAgo(data.targetsUpdatedAt))}</b></span>`;

  // Notices
  const notices = [];
  if (data.group.gymsWithTargets === 0){
    notices.push(`No targets have been entered yet, so there is nothing to track against.
      ${me && me.role === "admin" ? '<a href="/admin.html">Set targets →</a>' : "Ask an admin to set them."}`);
  } else if (data.group.gymsWithTargets < data.group.gymCount){
    const missing = data.group.gymCount - data.group.gymsWithTargets;
    notices.push(`${missing} gym${missing === 1 ? "" : "s"} still ${missing === 1 ? "has" : "have"} no target set.
      ${me && me.role === "admin" ? '<a href="/admin.html">Set targets →</a>' : ""}`);
  }
  el("notices").innerHTML = notices.map(n => `<div class="notice">${n}</div>`).join("");

  // Hero — the whole scope rolled up, or the single gym on its own
  const single = data.gyms.length === 1;
  const scope = single ? data.gyms[0] : data.group;
  el("subline").textContent = single
    ? data.gyms[0].gym
    : `${data.group.gymCount} gyms · % of target`;

  const needFoot = block => block.metAlready
    ? '<span><b class="good">Target already met</b></span>'
    : `<span>Need <b class="${needTone(block)}">${moneyText(block.requiredPerDay)}</b> a day for ${block.daysRemainingIncludingToday} day${block.daysRemainingIncludingToday === 1 ? "" : "s"}</span>`;

  const weekFoot = scope.week.targetSet ? `
      <span>Pace <b class="${tone(scope.week.pacePct)}">${pctText(scope.week.pacePct)}</b></span>
      ${needFoot(scope.week)}`
    : "<span>Set a weekly target to track this</span>";

  const monthFoot = scope.month.targetSet ? `
      <span>Pace <b class="${tone(scope.month.pacePct)}">${pctText(scope.month.pacePct)}</b></span>
      ${needFoot(scope.month)}`
    : "<span>Set a monthly target to track this</span>";

  const todayFoot = scope.today.targetSet
    ? `<span>Day <b>${pctText(cal.todayElapsedPct)}</b> elapsed</span>
       <span>Yesterday <b>${pctText(scope.yesterday.achievedPct)}</b></span>`
    : "<span>Set a daily target to track this</span>";

  el("hero").innerHTML =
      heroCard("Today", dayLabel(cal.today) + " " + cal.today, scope.today, todayFoot)
    + heroCard("This week", `Mon ${cal.weekStart} → Sun · day ${cal.weekDayIndex} of 7`, scope.week, weekFoot)
    + heroCard("This month", `${cal.monthStart.slice(0,7)} · day ${cal.monthDayIndex} of ${cal.daysInMonth}`, scope.month, monthFoot);

  // A single-gym login gets the detail and trend on their own, without the
  // meters the hero above already shows.
  if (single){
    const g = data.gyms[0];
    el("gymSection").style.display = "";
    el("gymSectionTitle").textContent = "Detail";
    el("sortSel").style.display = "none";
    el("gymGrid").style.gridTemplateColumns = "minmax(0,760px)";
    el("gymGrid").innerHTML = `
      <div class="gym-card">
        <div class="detail" style="margin-top:0;padding-top:0;border-top:none">
          ${periodDetail("Week", g.week)}
          ${periodDetail("Month", g.month)}
        </div>
        <div class="spark">
          <div class="spark-head">
            <span>Last 14 days vs daily target</span>
            <span>dashed line = 100%</span>
          </div>
          ${sparkline(g.trend)}
        </div>
      </div>`;
    return;
  }

  el("gymSection").style.display = "";
  el("sortSel").style.display = "";
  el("gymSectionTitle").textContent = `By gym (${data.gyms.length})`;

  const sortBy = el("sortSel").value;
  const rank = g => {
    if (sortBy === "name") return 0;
    const block = sortBy === "today" ? g.today : sortBy === "month" ? g.month : g.week;
    return block.targetSet && block.achievedPct != null ? -block.achievedPct : Infinity;
  };
  const rows = data.gyms.slice().sort((a, b) => {
    const d = rank(a) - rank(b);
    return d !== 0 && Number.isFinite(d) ? d : a.gym.localeCompare(b.gym);
  });

  el("gymGrid").innerHTML = rows.map(gymCard).join("")
    || '<div class="empty">No gyms on this login.</div>';
}

function periodDetail(title, block){
  if (!block.targetSet){
    return `<div><div class="detail-col-title">${esc(title)}</div>
      <div class="detail-line"><span>No target set</span></div></div>`;
  }
  const need = block.metAlready
    ? '<b class="good">Target met</b>'
    : `<b class="${needTone(block)}">${moneyText(block.requiredPerDay)}</b>`;
  return `
    <div>
      <div class="detail-col-title">${esc(title)}</div>
      <div class="detail-line"><span>Pace</span><b class="${tone(block.pacePct)}">${pctText(block.pacePct)}</b></div>
      <div class="detail-line"><span>Run rate</span><b>${block.runRatePctOfDaily == null ? "too early" : pctText(block.runRatePctOfDaily) + " of a day"}</b></div>
      <div class="detail-line"><span>Need / day (${block.daysRemainingIncludingToday} left)</span>${need}</div>
      <div class="detail-line"><span>Projected finish</span><b>${block.projectedPct == null ? "too early" : pctText(block.projectedPct)}</b></div>
    </div>`;
}

function gymCard(g){
  const pace = g.week.targetSet ? g.week.pacePct
             : g.month.targetSet ? g.month.pacePct
             : null;
  return `
    <div class="gym-card">
      <div class="gym-head">
        <div class="gym-name">${esc(g.gym)}</div>
        <div class="chip ${tone(pace)}">${toneLabel(pace)}</div>
      </div>

      ${meter("Today", g.today.achievedPct, g.today.expectedPct, g.today.targetSet)}
      ${meter("Week",  g.week.achievedPct,  g.week.expectedPct,  g.week.targetSet)}
      ${meter("Month", g.month.achievedPct, g.month.expectedPct, g.month.targetSet)}

      <div class="detail">
        ${periodDetail("Week", g.week)}
        ${periodDetail("Month", g.month)}
      </div>

      <div class="spark">
        <div class="spark-head">
          <span>Last 14 days vs daily target</span>
          <span>dashed line = 100%</span>
        </div>
        ${sparkline(g.trend)}
      </div>
    </div>`;
}

// ── Load ──────────────────────────────────────────────────────────────────
function showError(msg){
  el("loading").style.display = "none";
  el("app").style.display = "none";
  el("errorBox").style.display = "";
  el("errMsg").textContent = msg;
}

async function load(){
  el("errorBox").style.display = "none";
  if (!data) el("loading").style.display = "flex";

  try {
    const [meRes, progressRes] = await Promise.all([
      fetch("/api/me", { cache: "no-store" }),
      fetch("/api/progress", { cache: "no-store" })
    ]);

    if (meRes.status === 401 || progressRes.status === 401){
      window.location.href = "/login.html";
      return;
    }
    if (!progressRes.ok){
      const body = await progressRes.json().catch(() => ({}));
      showError(body.error || `Request failed (${progressRes.status})`);
      return;
    }

    me = meRes.ok ? await meRes.json() : null;
    data = await progressRes.json();

    el("loading").style.display = "none";
    el("app").style.display = "block";
    render();
  } catch (e) {
    showError(e.message || "Network error");
  }
}

async function signOut(){
  await fetch("/api/logout", { method: "POST" }).catch(() => {});
  window.location.href = "/login.html";
}

load();
setInterval(load, AUTO_REFRESH_MS);
</script>
